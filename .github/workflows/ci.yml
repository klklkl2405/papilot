name: Node 22 isolated workspace exit diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-exit:
    name: exit diagnosis - ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: current-workspace
            ref: c6ee20c7003dbafe422460a7b18335fe734bb1a9
            suite: workspace
            seconds: 180
          - label: base-workspace
            ref: 9dcf5caa1dc9f71848ba1c6d774b965e4457e025
            suite: workspace
            seconds: 180
          - label: current-full
            ref: c6ee20c7003dbafe422460a7b18335fe734bb1a9
            suite: full
            seconds: 300
          - label: base-full
            ref: 9dcf5caa1dc9f71848ba1c6d774b965e4457e025
            suite: full
            seconds: 300
    env:
      PAPILOT_CLAUDE_BIN: /nonexistent/papilot-no-agent
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - run: npm ci
      - run: npm --prefix engine ci
      - run: npm --prefix engine run build
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-xetex texlive-lang-chinese poppler-utils
      - name: Install diagnostic import outside checkout
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/workspace-handle-diagnostic.mjs" <<'DIAGNOSTIC'
          import { createHook } from 'node:async_hooks';
          import fs from 'node:fs';
          import path from 'node:path';
          import os from 'node:os';
          const started = Date.now();
          const resources = new Map();
          const file = path.join(process.env.RUNNER_TEMP || os.tmpdir(), `node22-workspace-handles-${process.pid}.jsonl`);
          createHook({
            init(id, type, trigger, resource) {
              if (['Timeout', 'PROCESSWRAP', 'TCPSERVERWRAP', 'TCPWRAP', 'WORKER', 'MESSAGEPORT'].includes(type)) {
                resources.set(id, { type, resource: new WeakRef(resource), at: Date.now(), stack: new Error().stack.split('\n').slice(2, 13).join('\n') });
              }
            },
            destroy(id) { resources.delete(id); }
          }).enable();
          function report(phase) {
            const live = [...resources].flatMap(([id, entry]) => {
              const resource = entry.resource.deref();
              if (!resource || (entry.type === 'Timeout' && !resource.hasRef?.())) return [];
              return [{ id, type: entry.type, age: Date.now() - entry.at, ms: resource._idleTimeout,
                ref: resource.hasRef?.(), stack: entry.stack }];
            });
            const handles = process._getActiveHandles().map(handle => ({
              type: handle.constructor?.name, pid: handle.pid, fd: handle.fd,
              connected: handle.connected, listening: handle.listening, destroyed: handle.destroyed,
              pending: handle.pending, localPort: handle.localPort, remotePort: handle.remotePort,
              exitCode: handle.exitCode, signalCode: handle.signalCode,
              spawnargs: handle.spawnargs, ref: handle.hasRef?.()
            }));
            fs.appendFileSync(file, JSON.stringify({ phase, elapsed: Date.now() - started,
              pid: process.pid, ppid: process.ppid, argv: process.argv, execArgv: process.execArgv, time: new Date().toISOString(), live, handles,
              resources: process.getActiveResourcesInfo() }) + '\n');
          }
          setInterval(() => report('interval'), 10000).unref();
          report('start');
          process.on('beforeExit', () => report('beforeExit'));
          process.on('exit', () => report('exit'));
          DIAGNOSTIC
      - name: Run selected tests with bounded process tracing
        shell: bash
        env:
          DIAGNOSTIC_SUITE: ${{ matrix.suite }}
          DIAGNOSTIC_SECONDS: ${{ matrix.seconds }}
        run: |
          node --version
          git rev-parse HEAD
          set +e
          if [[ "$DIAGNOSTIC_SUITE" == full ]]; then
            timeout --signal=TERM --kill-after=15s "${DIAGNOSTIC_SECONDS}s" env NODE_OPTIONS="--import=$RUNNER_TEMP/workspace-handle-diagnostic.mjs" npm test > "$RUNNER_TEMP/workspace-tests.log" 2>&1 &
          else
            timeout --signal=TERM --kill-after=15s "${DIAGNOSTIC_SECONDS}s" node --import tsx --import "$RUNNER_TEMP/workspace-handle-diagnostic.mjs" --test tests/workspace.test.ts > "$RUNNER_TEMP/workspace-tests.log" 2>&1 &
          fi
          test_pid=$!
          (
            while kill -0 "$test_pid" 2>/dev/null; do
              date --iso-8601=seconds
              ps -eo pid,ppid,pgid,stat,etimes,comm
              sleep 10
            done
          ) > "$RUNNER_TEMP/workspace-processes.log" 2>&1 &
          monitor_pid=$!
          wait "$test_pid"
          result=$?
          kill "$monitor_pid" 2>/dev/null
          wait "$monitor_pid" 2>/dev/null
          printf '%s\n' "$result" > "$RUNNER_TEMP/workspace-exit-code.txt"
          cat "$RUNNER_TEMP/workspace-tests.log"
          exit "$result"
      - name: Print final handle and process evidence
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for diagnostic in "$RUNNER_TEMP"/node22-workspace-handles-*.jsonl; do
            printf '%s\n' "$diagnostic"
            tail -n 4 "$diagnostic"
          done
          ps -eo pid,ppid,pgid,stat,etimes,comm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node22-workspace-exit-${{ matrix.label }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/workspace-tests.log
            ${{ runner.temp }}/workspace-processes.log
            ${{ runner.temp }}/workspace-exit-code.txt
            ${{ runner.temp }}/workspace-handle-diagnostic.mjs
            ${{ runner.temp }}/node22-workspace-handles-*.jsonl
